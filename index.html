<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>interimNotes</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <header>
        <h1>interimNotes</h1>
        <p>Notes up to 1000 characters. Save and share for 3 days.</p>
    </header>
    <div class="container collapsed">
        <div class="editor">
            <textarea placeholder="Click here to write a new note..."></textarea>
        </div>
        <button id="createNote">Create new note</button>
    </div>
    <div class="watermark">Created by Adam Kurbiel</div>
    <script src="app.js"></script>
</body>
</html>
